<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#292b46">
  <meta name="description" content="작은 마법학교에서 시작하는 우리들의 이야기. 루멘 마법학교 플레이 프로토타입.">
  <title>루멘 마법학교 · 우리의 작은 세계</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="readability.css">
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2 2.6 7.4L22 12l-7.4 2.6L12 22l-2.6-7.4L2 12l7.4-2.6Z"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2Zm6-2v16m6-14v16"/></symbol>
    <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 5C8 2 4 3 2 4v15c3-1 6-1 10 2 4-3 7-3 10-2V4c-3-1-7-2-10 1Zm0 0v16"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="12" cy="19" r="3"/><path d="m7 9 4 7m6-7-4 7M9 6h6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11a9 9 0 0 1-9 9H4l-3 2 2-7a9 9 0 1 1 18-4Z"/><path d="M7 10h10M7 14h6"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M20 3C7 1 2 8 6 15s15 6 14-12ZM3 22 15 9"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 8a3 3 0 1 1 4 3c-1 0-1 1-1 3m0 3v.1"/></symbol>
  </defs></svg>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="루멘 마법학교 홈"><span class="brand-mark"><svg><use href="#i-star"/></svg></span><span><strong>LUMEN</strong><small>루멘 마법학교</small></span></a>
      <div class="world-caption"><span class="tiny-star">✦</span> 우리의 작은 세계, 함께 쓰는 이야기</div>
      <div class="top-actions"><span class="preview-badge">플레이 프로토타입</span><button class="icon-button" id="help-button" aria-label="도움말"><svg><use href="#i-help"/></svg></button><button class="user-button" data-panel="profile"><span class="mini-avatar">✦</span><span id="header-name">새봄</span><span class="chevron">⌄</span></button></div>
    </header>
    <div class="workspace">
      <nav class="rail" aria-label="학교 메뉴">
        <button class="rail-button active" id="map-button" aria-current="page"><svg><use href="#i-map"/></svg><span>학교 맵</span></button>
        <button class="rail-button" data-panel="profile"><svg><use href="#i-person"/></svg><span>내 캐릭터</span></button>
        <button class="rail-button" data-panel="relations"><svg><use href="#i-link"/></svg><span>관계도</span></button>
        <button class="rail-button" data-panel="quests"><svg><use href="#i-book"/></svg><span>퀘스트</span><span class="nav-notice" id="quest-dot"></span></button>
        <div class="rail-bottom"><span class="rail-moon">☾</span><span>이야기의<br>시작</span></div>
      </nav>
      <main class="game-area" aria-label="루멘 마법학교 정원">
        <canvas id="world" tabindex="0" aria-label="학교 정원. 방향키 또는 WASD로 이동하고 E로 주변 사물과 상호작용하세요."></canvas>
        <div class="map-heading"><span class="eyebrow">LUMEN CAMPUS</span><h1>오래된 학교 정원 <span>✧</span></h1><p><span class="sun-symbol">☀</span> 햇살이 내려앉는 조용한 오후</p></div>
        <div class="scene-badge"><span class="scene-dot"></span> 혼자 둘러보기 <span class="badge-divider"></span> 정원</div>
        <button class="map-quest" data-panel="quests"><span class="quest-icon"><svg><use href="#i-leaf"/></svg></span><span><small id="quest-caption">오늘의 작은 부탁</small><strong id="quest-title">온실에 달빛잎이 필요해요</strong><span id="quest-progress-label">게시판에서 이야기 확인하기</span></span><span class="quest-bullet">!</span></button>
        <div class="map-bottom"><div class="movement-hint"><span class="desktop-help"><kbd>W</kbd><span class="key-group"><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span></span><span>이동 <i>·</i> 바닥을 눌러도 이동해요</span><span class="hint-separator"></span><kbd>E</kbd><span>상호작용</span></div><button id="center-button" class="small-button">시작 위치</button></div>
        <button id="interaction" class="interaction hidden"></button>
        <div class="mobile-controls" aria-label="터치 이동"><button data-move="up" aria-label="위로">△</button><button data-move="left" aria-label="왼쪽으로">◁</button><button data-move="down" aria-label="아래로">▽</button><button data-move="right" aria-label="오른쪽으로">▷</button></div>
        <div id="toast" role="status" class="toast hidden"></div>
      </main>
      <aside class="chat-panel" aria-label="역할극 대화">
        <div class="chat-heading"><div><span class="eyebrow">OUR STORIES</span><h2>정원에서 나누는 이야기</h2></div><svg><use href="#i-chat"/></svg></div>
        <div class="chat-tabs"><button class="selected" id="chat-tab" aria-selected="true">공간 대화</button><button id="people-tab" aria-selected="false">등장인물 <span>3</span></button></div>
        <div id="chat-view" class="chat-view"><div class="chat-feed" id="chat-feed" role="log" aria-label="대화 기록" aria-live="polite"></div><div class="chat-composer"><div class="composer-modes" role="group" aria-label="대화 종류"><button class="selected" data-mode="speech">대사</button><button data-mode="action">행동 묘사</button><span>Enter로 보내기</span></div><form id="chat-form"><label class="sr-only" for="chat-input">대사 또는 행동 입력</label><textarea id="chat-input" rows="2" maxlength="500" placeholder="캐릭터의 이야기를 들려주세요…"></textarea><button class="send-button" type="submit" aria-label="대화 보내기"><svg><use href="#i-star"/></svg></button></form><p class="local-note">브라우저 체험 모드 · 다른 이용자에게 전송되지 않아요</p></div></div>
        <div id="people-view" class="people-view hidden"></div>
        <div class="my-character"><span class="portrait small" id="my-portrait">✦</span><div><strong id="footer-name">새봄</strong><small id="footer-house">별무리 기숙사 · 1학년</small></div><button class="icon-button" data-panel="profile" aria-label="캐릭터 시트 열기"><svg><use href="#i-person"/></svg></button></div>
      </aside>
    </div>
  </div>
  <dialog id="panel-dialog" aria-labelledby="panel-title"><div class="dialog-top"><span class="eyebrow" id="panel-eyebrow"></span><button class="icon-button" id="close-panel" aria-label="창 닫기"><svg><use href="#i-close"/></svg></button></div><div id="panel-content"></div></dialog>
</body>
</html>
